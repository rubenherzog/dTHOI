name: validate-real-neural-benchmark

on:
  push:
    branches:
      - validation/mc-maze-real-benchmark

jobs:
  mc-maze-small:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pynwb dandi psutil
      - name: Download pinned MC_Maze_Small NWB
        run: |
          mkdir -p data
          dandi download --download assets --path-type exact -o data \
            "dandi://dandi/000140@0.220113.0408/sub-Jenkins/sub-Jenkins_ses-small_desc-train_behavior+ecephys.nwb"
          find data -maxdepth 4 -type f -name '*.nwb' -ls
      - name: Run targeted direct-O finite-sample benchmark
        run: |
          NWB_PATH="$(find data -type f -name '*.nwb' | head -n 1)"
          test -n "$NWB_PATH"
          python benchmarks/benchmark_mc_maze_o_direct.py \
            --nwb-path "$NWB_PATH" \
            --output-dir benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-maze-o-direct-benchmark
          path: benchmark-results
          if-no-files-found: warn
