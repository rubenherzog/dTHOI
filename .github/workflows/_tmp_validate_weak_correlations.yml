name: validate-weak-correlations

on:
  push:
    branches:
      - feature/discrete-entropy-estimators

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python benchmarks/_tmp_validate_weak_correlations.py
      - run: python benchmarks/_tmp_validate_local_contracts.py
