[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dthoi"
version = "0.1.0.dev0"
description = "High-throughput higher-order information analysis for discrete multivariate data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dthoi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
